[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdp-browser-agent"
version = "0.6.0"
description = "A standalone AI browser agent powered by Playwright and OpenAI-compatible chat models."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "CDP Browser Agent Maintainers" }
]
keywords = ["browser-agent", "playwright", "ai-agent", "browser-automation", "openai-compatible"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx[socks]>=0.27.0",
  "httpx2>=2.5,<3",
  "mcp>=2.2,<3",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
  "playwright>=1.51.0",
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = [
  "wheel>=0.45",
  "setuptools>=69",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "build>=1.2.0",
  "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/HGF-XNDX/CDP-Browser-Agent"
Repository = "https://github.com/HGF-XNDX/CDP-Browser-Agent"
Issues = "https://github.com/HGF-XNDX/CDP-Browser-Agent/issues"

[project.scripts]
browser-agent = "cdp_browser_agent.browser.cli:main"
cdp-browser-agent = "cdp_browser_agent.browser.cli:main"
cdp-browser-agent-mcp = "cdp_browser_agent.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cdp_browser_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.package-data]
cdp_browser_agent = ["skills/*/SKILL.md", "skills/*/references/*.md"]
